<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <div class="card">

            <div class="card-inner">

                <!-- Front side -->
                <section class="card-front">
                    <img src="web-development.jpg"
                         alt="Laptop displaying website code">

                    <h2>Web Development</h2>
                    <p>Hover over the card</p>
                </section>

                <!-- Back side -->
                <section class="card-back">
                    <h2>About Web Development</h2>

                    <p>
                        Web development involves creating responsive websites
                        using technologies such as HTML, CSS and JavaScript.
                    </p>
                </section>

            </div>

        </div>
    </main>

</body>
</html>
