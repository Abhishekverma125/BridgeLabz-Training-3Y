<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Nature Photo Gallery</h1>
        <p>Beautiful views from around the world</p>
    </header>

    <main class="gallery">

        <figure>
            <div class="image-container">
                <img src="mountain.jpg" alt="A mountain landscape">
            </div>
            <figcaption>Beautiful Mountains</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="forest.jpg" alt="A green forest">
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="beach.jpg" alt="A peaceful beach">
            </div>
            <figcaption>Peaceful Beach</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="waterfall.jpg" alt="A natural waterfall">
            </div>
            <figcaption>Natural Waterfall</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="lake.jpg" alt="A calm lake">
            </div>
            <figcaption>Calm Lake</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="sunset.jpg" alt="A colorful sunset">
            </div>
            <figcaption>Colorful Sunset</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="flowers.jpg" alt="Colorful flowers">
            </div>
            <figcaption>Colorful Flowers</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="snow.jpg" alt="Snow-covered mountains">
            </div>
            <figcaption>Snowy Mountains</figcaption>
        </figure>

    </main>

</body>
</html>
