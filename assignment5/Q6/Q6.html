<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Move the cursor over an image to view its caption.</p>
    </header>

    <main class="gallery">

        <figure class="gallery-item">
            <img src="image1.jpg" alt="Mountains">
            <figcaption>Beautiful Mountains</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="image2.jpg" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="image3.jpg" alt="Beach">
            <figcaption>Peaceful Beach</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="image4.jpg" alt="City">
            <figcaption>Modern City</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="image5.jpg" alt="Waterfall">
            <figcaption>Natural Waterfall</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="image6.jpg" alt="Sunset">
            <figcaption>Colourful Sunset</figcaption>
        </figure>

    </main>

    <footer>
        <p>&copy; 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
