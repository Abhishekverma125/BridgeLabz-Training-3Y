<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>

<body>

    <!-- School Name -->
    <h1>Dharam Public School</h1>

    <h2>Student Report Card</h2>

    <!-- Student Information -->
    <table border="1">

        <tr>
            <th>Student Name</th>
            <td>Abhishek</td>
        </tr>

        <tr>
            <th>Class</th>
            <td>B.Tech Student</td>
        </tr>

    </table>

    <br>

    <!-- Marks Table -->
    <table border="1" title="Student Marks Report">

        <tr>
            <th>Subject</th>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Computer Science</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Physics</td>
            <td>100</td>
            <td>82</td>
        </tr>

        <tr>
            <td>Chemistry</td>
            <td>100</td>
            <td>78</td>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <!-- Total Row -->
        <tr>
            <th colspan="2">Total</th>
            <td>423 / 500</td>
        </tr>

        <!-- Percentage Row -->
        <tr>
            <th colspan="2">Percentage</th>
            <td>84.6%</td>
        </tr>

        <!-- Result Row -->
        <tr>
            <th rowspan="2">Result</th>
            <td colspan="2">Passed</td>
        </tr>

        <tr>
            <td colspan="2">Good Performance</td>
        </tr>

    </table>

</body>

</html>
