<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="badge">20% OFF</div>
    <div class="heart">♥</div>
    <img src="shoe.png" alt="Nike Shoe" class="shoe">
    <div class="details">
      <h4>SPORTS SHOES</h4>
      <h2>Premium Running Shoes</h2>
      <div class="rating">
        ★★★★★ <span>(120)</span>
      </div>
      <div class="price">
        ₹1,999 <span>₹2,499</span>
      </div>
    </div>
    <button class="btn">Add to Cart</button>
  </div>
</body>
</html>
