<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload Form</title>
</head>
<body>

    <h1>Upload an Image</h1>

    <form method="post" action="#" enctype="multipart/form-data">
        <label for="image">Choose an image:</label>

        <input
            type="file"
            id="image"
            name="image"
            accept=".jpg,.jpeg,.png"
            required>

        <p>Only JPG, JPEG, and PNG image files are allowed.</p>

        <button type="submit">Upload</button>
    </form>

</body>
</html>
