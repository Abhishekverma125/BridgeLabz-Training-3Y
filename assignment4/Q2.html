<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My City Map</title>
</head>
<body>

    <h2>Map of Palwal</h2>

    <!-- loading="lazy" delays loading the map until it is near the visible part of the webpage. -->
    <iframe
        title="Map showing Palwal, Haryana"
        src="https://www.google.com/maps?q=Palwal,Haryana&output=embed"
        width="80%"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
