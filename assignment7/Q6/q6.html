<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <header>
        <h1>CSS Transformations</h1>
        <p>Move the mouse over each box.</p>
    </header>

    <main>
        <section class="container" aria-label="Transformation examples">
            <figure>
                <div class="box rotate">Rotate</div>
                <figcaption>Rotates by 15 degrees.</figcaption>
            </figure>

            <figure>
                <div class="box scale">Scale</div>
                <figcaption>Grows to 1.2 times its size.</figcaption>
            </figure>

            <figure>
                <div class="box translate">Translate</div>
                <figcaption>Moves 20px right and 15px up.</figcaption>
            </figure>

            <figure>
                <div class="box skew">Skew</div>
                <figcaption>Slants by 15 degrees.</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>Assignment 7 | Transformation Practice</p>
    </footer>
</body>
</html>
