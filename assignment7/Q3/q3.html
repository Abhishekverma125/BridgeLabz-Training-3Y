<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header>
        <h1>CSS Gradient Backgrounds</h1>
    </header>

    <main>
        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>A linear gradient changes colours along a straight line.</p>
            <p>This background stays fixed while the page scrolls.</p>
        </section>

        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>A radial gradient changes colours outward from the centre.</p>
        </section>
    </main>

    <footer>
        <p>Assignment 7 | Gradient Practice</p>
    </footer>
</body>
</html>
