<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <header>
        <h1>Borders and Padding</h1>
        <p>Different border styles and spacing inside boxes.</p>
    </header>

    <main>
        <section class="container" aria-label="Border examples">
            <article class="box solid">
                <h2>Solid Border</h2>
                <p>Padding: 10px</p>
            </article>

            <article class="box dashed">
                <h2>Dashed Border</h2>
                <p>Padding: 20px</p>
            </article>

            <article class="box double">
                <h2>Double Border</h2>
                <p>Padding: 30px</p>
            </article>

            <article class="box groove">
                <h2>Groove Border</h2>
                <p>Padding: 40px</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Move the mouse over a box to change its border colour.</p>
    </footer>
</body>
</html>
